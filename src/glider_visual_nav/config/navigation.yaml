/**:
  ros__parameters:
    use_sim_time: true
    orientation_mode: homography_mag
    flight_regime: cruise_const_alt
    dynamic_height: false
    h: 40.0
    body_frame: base_link
    world_frame: odom
    optical_frame: camera_optical_frame
    camera_offset_body: [0.0, 0.0, 0.0]
    max_dt: 0.25
    max_sensor_age: 0.15
optical_flow_node:
  ros__parameters:
    fx: 539.936
    fy: 539.936
    cx: 640.0
    cy: 480.0
    image_width: 1280
    image_height: 960
    max_features: 300
    min_inliers: 12
    fb_threshold: 0.7
    ransac_threshold: 1.5
    max_lk_error: 30.0
    horizontal_tolerance: 0.05
    velocity_noise_floor: 0.02
navigation_node:
  ros__parameters:
    # East-positive radians; match the effective simulated field in Sprint 2.
    declination: 0.0
    yaw_variance: 0.0025
    tilt_variance: 0.0025
    min_field_tesla: 0.000001
    max_field_tesla: 0.001
los_controller_node:
  ros__parameters:
    waypoints: [0.0, 0.0, 200.0, 0.0, 200.0, 200.0, 0.0, 200.0]
    loop_waypoints: true
    waypoint_acceptance: 15.0
    lookahead: 40.0
    max_roll: 0.52
    min_guidance_speed: 3.0
    target_height: 40.0
    pitch_trim_up: 0.02
    min_pitch_up: -0.20
    max_pitch_up: 0.25
    max_roll_setpoint_rate: 0.5
    max_pitch_setpoint_rate: 0.2
    height_kp: 0.02
    height_ki: 0.001
    height_kd: 0.03
    height_integral_limit: 20.0
