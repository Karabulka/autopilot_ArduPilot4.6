    h: 40.0
    body_frame: base_link
    world_frame: odom
    optical_frame: camera_optical_frame
    camera_offset_body:
    - 0.0
    - 0.0
    - -0.25
    max_dt: 0.25
    max_sensor_age: 0.3
optical_flow_node:
  ros__parameters:
    fx: 269.968
    fy: 269.968
    cx: 320.0
    cy: 240.0
    image_width: 640
    image_height: 480
    max_features: 300
    min_inliers: 12
    fb_threshold: 0.5
    ransac_threshold: 1.5
    max_lk_error: 40.0
    horizontal_tolerance: 0.05
    velocity_noise_floor: 0.02
navigation_node:
