    target_height: 40.0
    pitch_trim_up: -0.025
    min_pitch_up: -0.18
    max_pitch_up: 0.25
    max_roll_setpoint_rate: 0.5
    max_pitch_setpoint_rate: 0.2
    height_kp: 0.018
    height_ki: 0.001
